<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bing 每日壁纸画廊，自动获取高清壁纸">
  <title>Bing Wallpaper</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>history.scrollRestoration = 'manual';</script>
</head>
<body>
  <section class="hero" id="hero">
    <div class="hero-loader" id="heroLoader">
      <div class="hero-spinner"></div>
    </div>
    <div class="hero-content">
      <div class="hero-date" id="heroDate"></div>
      <h1 class="hero-title" id="heroTitle"></h1>
    </div>
  </section>

  <aside class="timeline-sidebar" id="timelineSidebar"></aside>

  <main class="chronicle" id="chronicle">
    <div class="skeleton" id="skeleton">
      <div class="skeleton-year">
        <div class="skeleton-bar skeleton-shimmer" style="width:80px;height:32px"></div>
        <div class="skeleton-bar skeleton-shimmer" style="width:50px;height:24px;border-radius:20px"></div>
      </div>
      <div class="skeleton-grid">
        <div class="skeleton-thumb skeleton-shimmer"></div>
        <div class="skeleton-thumb skeleton-shimmer"></div>
        <div class="skeleton-thumb skeleton-shimmer"></div>
        <div class="skeleton-thumb skeleton-shimmer"></div>
        <div class="skeleton-thumb skeleton-shimmer"></div>
        <div class="skeleton-thumb skeleton-shimmer"></div>
      </div>
    </div>
  </main>

  <script defer src="/static/gallery.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bing 每日壁纸画廊，自动获取高清壁纸">
  <title>Bing Wallpaper</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
  <script>history.scrollRestoration='manual';</script>
  <script src="/static/markets.js"></script>
</head>
<body>
  <section class="hero" id="hero">
    <div class="hero-loader" id="heroLoader">
      <div class="hero-spinner"></div>
    </div>
    <div class="hero-content">
      <div class="hero-date" id="heroDate"></div>
      <h1 class="hero-title" id="heroTitle"></h1>
    </div>
  </section>

  <aside class="timeline-sidebar" id="timelineSidebar"></aside>

  <div class="market-selector" id="marketSelector">
    <button class="market-btn" id="marketBtn" title="切换市场">
      <span class="fi fis square-flag" id="marketFlag"></span>
    </button>
    <div class="market-dropdown" id="marketDropdown"></div>
  </div>
  <script>
    (function(){
      var m=localStorage.getItem('bing_market')||'zh-CN';
      var flags=window.BING_MARKETS.flags;
      document.getElementById('marketFlag').className='fi fi-'+(flags[m]||'un')+' fis square-flag';
    })();
  </script>

  <main class="chronicle" id="chronicle">
    <div class="skeleton" id="skeleton">
      <div class="skeleton-year">
        <div class="skeleton-bar skeleton-shimmer" style="width:80px;height:32px"></div>
        <div class="skeleton-bar skeleton-shimmer" style="width:50px;height:24px;border-radius:20px"></div>
      </div>
      <div class="skeleton-grid">
        <div class="skeleton-thumb skeleton-shimmer"></div>
        <div class="skeleton-thumb skeleton-shimmer"></div>
        <div class="skeleton-thumb skeleton-shimmer"></div>
        <div class="skeleton-thumb skeleton-shimmer"></div>
        <div class="skeleton-thumb skeleton-shimmer"></div>
        <div class="skeleton-thumb skeleton-shimmer"></div>
      </div>
    </div>
  </main>

  <script defer src="/static/gallery.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bing Wallpaper 管理面板</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <header class="header">
    <div class="header-inner">
      <div class="header-top">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </div>
          <div class="logo-text">
            <h1>Bing Wallpaper</h1>
            <span class="logo-sub">管理面板</span>
          </div>
        </div>
        <div class="header-actions" id="headerActions" style="display:none;">
          <div class="theme-switcher">
            <button class="theme-btn active" data-theme="sakura" title="樱花粉">
              <span class="theme-dot"></span>
            </button>
            <button class="theme-btn" data-theme="ocean" title="海洋蓝">
              <span class="theme-dot"></span>
            </button>
            <button class="theme-btn" data-theme="forest" title="森林绿">
              <span class="theme-dot"></span>
            </button>
            <button class="theme-btn" data-theme="dark" title="深邃黑">
              <span class="theme-dot"></span>
            </button>
          </div>
          <button class="btn btn-ghost" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
            <span>退出</span>
          </button>
        </div>
      </div>
      <p class="tagline">每日自动更新 · 数据按月存储</p>
    </div>
  </header>

  <main class="container">
    <section id="loginView" class="view">
      <div class="card glass login-card">
        <div class="card-body">
          <div class="login-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21v-2a4 4 0 014-4h8a4 4 0 014 4v2"/>
            </svg>
          </div>
          <h2>身份验证</h2>
          <p class="login-hint">请输入管理 Token 以继续</p>
          <div class="input-group">
            <input type="password" id="tokenInput" placeholder="管理 Token" autocomplete="off">
            <button class="btn btn-primary" onclick="login()">
              <span>进入</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="mainView" class="view hidden">
      <div class="stats-grid" id="statsArea"></div>

      <div class="card glass">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon purple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
              </svg>
            </div>
            <h3>导入数据</h3>
          </div>
        </div>
        <div class="card-body">
          <div class="drop-zone" id="dropZone">
            <div class="drop-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3"/>
              </svg>
            </div>
            <p class="drop-text">拖拽 JSON 文件到此处</p>
            <p class="drop-hint">或点击选择文件</p>
            <input type="file" id="fileInput" accept=".json" hidden>
          </div>
          <div class="progress-track" id="importProgress">
            <div class="progress-fill"></div>
          </div>
          <div class="import-result" id="importResult"></div>
        </div>
      </div>

      <div class="card glass">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
              </svg>
            </div>
            <h3>导出数据</h3>
          </div>
        </div>
        <div class="card-body">
          <div class="export-form">
            <div class="input-row">
              <input type="text" id="exportStart" placeholder="起始月份 202102">
              <span class="separator">—</span>
              <input type="text" id="exportEnd" placeholder="结束月份 202605">
            </div>
            <div class="btn-group">
              <button class="btn btn-outline" onclick="exportData()">预览</button>
              <button class="btn btn-primary" onclick="exportData(true)">下载</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card glass">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon amber">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
              </svg>
            </div>
            <h3>快捷操作</h3>
          </div>
        </div>
        <div class="card-body">
          <div class="action-grid">
            <button class="action-btn" onclick="triggerUpdate()">
              <div class="action-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M23 4v6h-6M1 20v-6h6"/>
                  <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                </svg>
              </div>
              <span>手动更新</span>
            </button>
            <button class="action-btn" onclick="refreshStats()">
              <div class="action-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 20V10M12 20V4M6 20v-6"/>
                </svg>
              </div>
              <span>刷新统计</span>
            </button>
          </div>
        </div>
      </div>

      <div class="card glass">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon teal">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <path d="M16 2v4M8 2v4M3 10h18"/>
              </svg>
            </div>
            <h3>月份数据</h3>
          </div>
        </div>
        <div class="card-body no-padding">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>月份</th>
                  <th>记录数</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="monthTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="/admin/app.js"></script>
</body>
</html>

name: Deploy to Cloudflare

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check API_BASE_URL
        run: |
          API_URL="${{ vars.API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            echo "ERROR: API_BASE_URL variable is not set"
            exit 1
          fi
          echo "API_BASE_URL=$API_URL" >> $GITHUB_ENV
          echo "API_BASE_URL is configured: $API_URL"

      - run: npm install -g wrangler

      - name: Setup KV namespace
        id: kv
        run: |
          KV_ID=$(wrangler kv namespace list 2>/dev/null | python3 -c "import sys,json; print(next((i['id'] for i in json.load(sys.stdin) if 'BING_KV' in i.get('title','')), ''))" || echo "")
          [ -z "$KV_ID" ] && KV_ID=$(wrangler kv namespace create BING_KV --preview false 2>&1 | grep -oP 'id\s*=\s*"\K[^"]+' || echo "")
          [ -z "$KV_ID" ] && { echo "ERROR: Failed to get KV ID"; exit 1; }
          echo "KV_ID=$KV_ID" >> $GITHUB_ENV

      - name: Deploy Backend API
        working-directory: backend
        run: |
          sed -i "s/id = \"your-kv-namespace-id\"/id = \"$KV_ID\"/g" wrangler.toml
          sed -i '/^AUTH_TOKEN/d' wrangler.toml
          echo "AUTH_TOKEN = \"${{ secrets.AUTH_TOKEN }}\"" >> wrangler.toml
          wrangler deploy

      - name: Inject API_BASE and Deploy Frontend
        working-directory: frontend
        run: |
          echo "Injecting API_BASE: $API_BASE_URL"
          echo "API_BASE length: ${#API_BASE_URL}"
          
          ESCAPED_URL=$(echo "$API_BASE_URL" | sed 's/[\/&]/\\&/g')
          echo "Escaped URL: $ESCAPED_URL"
          
          for file in $(find . -name "*.js" -type f); do
            sed -i "s|__API_BASE__|$ESCAPED_URL|g" "$file"
          done
          
          echo "Verifying injection:"
          grep "API_BASE" static/gallery.js || echo "Not found in gallery.js"
          
          wrangler pages project create bing --production-branch=main 2>/dev/null || true
          wrangler pages deploy . --project-name=bing --commit-dirty=true

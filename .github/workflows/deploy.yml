name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Setup KV namespace
        id: setup-kv
        run: |
          echo "Checking existing KV namespaces..."
          KV_LIST=$(wrangler kv:namespace list 2>&1)
          echo "KV List: $KV_LIST"
          
          KV_ID=$(echo "$KV_LIST" | python3 -c "import sys,json; data=json.load(sys.stdin); print(next((i['id'] for i in data if 'BING_KV' in i.get('title','')), ''))" 2>/dev/null || echo "")
          
          if [ -z "$KV_ID" ]; then
            echo "Creating new KV namespace..."
            CREATE_OUTPUT=$(wrangler kv:namespace create BING_KV 2>&1)
            echo "Create output: $CREATE_OUTPUT"
            KV_ID=$(echo "$CREATE_OUTPUT" | grep -oP 'id\s*=\s*"\K[^"]+' || echo "$CREATE_OUTPUT" | grep -oP '"id"\s*:\s*"\K[^"]+' || echo "")
          fi
          
          if [ -z "$KV_ID" ]; then
            echo "ERROR: Failed to get KV namespace ID"
            exit 1
          fi
          
          echo "KV Namespace ID: $KV_ID"
          echo "KV_NAMESPACE_ID=$KV_ID" >> $GITHUB_ENV
          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update wrangler.toml
        run: |
          sed -i "s/id = \"your-kv-namespace-id\"/id = \"$KV_NAMESPACE_ID\"/g" wrangler.toml
          sed -i "s/AUTH_TOKEN = \"your-secret-token-here\"/AUTH_TOKEN = \"$AUTH_TOKEN\"/g" wrangler.toml
          echo "Updated wrangler.toml:"
          cat wrangler.toml
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

      - name: Deploy to Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

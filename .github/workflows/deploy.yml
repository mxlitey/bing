name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main  # 当代码推送到main分支时触发部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Login to Cloudflare
        run: wrangler login --api-token ${{ secrets.CLOUDFLARE_API_TOKEN }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Workers
        run: wrangler publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy success notification
        if: success()
        run: echo "Successfully deployed to Cloudflare Workers!"

      - name: Deploy failure notification
        if: failure()
        run: echo "Deployment to Cloudflare Workers failed!"
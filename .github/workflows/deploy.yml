name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Create KV namespace if not exists
        id: create-kv
        run: |
          KV_LIST=$(wrangler kv:namespace list 2>&1 || echo "[]")
          KV_ID=$(echo "$KV_LIST" | grep -o '"id"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"/\1/' || true)
          
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "[]" ]; then
            echo "Creating KV namespace..."
            CREATE_OUTPUT=$(wrangler kv:namespace create BING_KV 2>&1 || true)
            echo "Create output: $CREATE_OUTPUT"
            KV_ID=$(echo "$CREATE_OUTPUT" | grep -oP 'id[[:space:]]*=[[:space:]]*"\K[^"]+' || echo "$CREATE_OUTPUT" | grep -o '"id"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)"/\1/' || true)
          fi
          
          if [ -z "$KV_ID" ]; then
            echo "Failed to get KV ID, trying alternative method..."
            wrangler kv:namespace create BING_KV --preview false || true
            KV_LIST2=$(wrangler kv:namespace list 2>&1 || echo "[]")
            KV_ID=$(echo "$KV_LIST2" | grep -o '"id"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"/\1/' || true)
          fi
          
          echo "KV_NAMESPACE_ID=$KV_ID" >> $GITHUB_ENV
          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT
          echo "KV ID: $KV_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update wrangler.toml with KV ID and Auth Token
        run: |
          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "s/id = \"your-kv-namespace-id\"/id = \"$KV_NAMESPACE_ID\"/" wrangler.toml
            sed -i "s/id = \".*\" # KV_NAMESPACE_ID/id = \"$KV_NAMESPACE_ID\"/" wrangler.toml
          fi
          if [ -n "$AUTH_TOKEN" ]; then
            sed -i "s/AUTH_TOKEN = \"your-secret-token-here\"/AUTH_TOKEN = \"$AUTH_TOKEN\"/" wrangler.toml
            sed -i "s/AUTH_TOKEN = \"\"/AUTH_TOKEN = \"$AUTH_TOKEN\"/" wrangler.toml
          fi
          cat wrangler.toml
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

      - name: Deploy to Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
